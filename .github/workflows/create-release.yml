name: create-release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        required: true
        type: choice
        options:
          - :patch
          - :minor
          - :major
        description: 'Bump type of release'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Set GPG
        run: |
          apt install -y gnupg
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_AUTH_TOKEN }}
      - name: Prepare java
        uses: actions/setup-java@v3
      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 'latest' # Clojure CLI based on tools.deps
          lein: 'latest' # Leiningen
      - name: Get leiningen version
        run: lein -v
      - name: Set Git config
        run: |
          git config user.name jm-bot
          git config user.email josemorista@gmail.com
      - name: Bump version
        run: lein change version leiningen.release/bump-version ${{ inputs.bump_type }}
      - name: Push changes to GitHub
        run: |
          git add --all
          git push
          git push --tags
